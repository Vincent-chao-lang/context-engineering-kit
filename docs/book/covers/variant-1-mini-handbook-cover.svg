<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2400" viewBox="0 0 1600 2400" role="img" aria-labelledby="title desc">
  <title id="title">Context Engineering Kit 迷你手册封面</title>
  <desc id="desc">深蓝色书籍封面，包含 Context Engineering Kit 迷你手册标题和文件化项目记忆主题图形。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061225"/>
      <stop offset="0.48" stop-color="#0a2450"/>
      <stop offset="1" stop-color="#0f3a78"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="28%" r="62%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="0.38" stop-color="#1d4ed8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#061225" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#93c5fd" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="2400" fill="url(#bg)"/>
  <rect width="1600" height="2400" fill="url(#grid)"/>
  <rect width="1600" height="2400" fill="url(#glow)"/>

  <g opacity="0.5">
    <circle cx="1320" cy="260" r="210" fill="#38bdf8" opacity="0.08"/>
    <circle cx="1410" cy="360" r="92" fill="#93c5fd" opacity="0.12"/>
    <path d="M0 1820C330 1690 530 1890 830 1760C1100 1643 1320 1510 1600 1600V2400H0Z" fill="#020617" opacity="0.22"/>
  </g>

  <g transform="translate(168 230)">
    <text x="0" y="0" fill="#bfdbfe" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="700">CONTEXT ENGINEERING KIT</text>
    <rect x="0" y="48" width="230" height="6" rx="3" fill="#38bdf8"/>
  </g>

  <g transform="translate(170 610)">
    <text x="0" y="0" fill="#f8fafc" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="150" font-weight="800">迷你手册</text>
    <text x="0" y="142" fill="#dbeafe" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="62" font-weight="600">一个下午跑通 AI 项目记忆</text>
    <text x="0" y="238" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="500">/start -> work -> /wrap</text>
  </g>

  <g transform="translate(170 1040)" filter="url(#softShadow)">
    <rect x="0" y="0" width="940" height="560" rx="34" fill="url(#panel)" stroke="#93c5fd" stroke-opacity="0.26" stroke-width="2"/>
    <g transform="translate(74 78)">
      <rect x="0" y="0" width="250" height="120" rx="18" fill="#0f2f61" stroke="#60a5fa" stroke-opacity="0.5"/>
      <rect x="0" y="180" width="250" height="120" rx="18" fill="#0f2f61" stroke="#60a5fa" stroke-opacity="0.5"/>
      <rect x="0" y="360" width="250" height="120" rx="18" fill="#0f2f61" stroke="#60a5fa" stroke-opacity="0.5"/>
      <text x="34" y="70" fill="#eff6ff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">CLAUDE.md</text>
      <text x="46" y="250" fill="#eff6ff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">TASKS.md</text>
      <text x="56" y="430" fill="#eff6ff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">memory/</text>
    </g>
    <g fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <path d="M370 138H560"/>
      <path d="M370 318H560"/>
      <path d="M370 498H560"/>
      <path d="M560 138V498"/>
      <path d="M560 318H704"/>
    </g>
    <g transform="translate(704 208)">
      <rect x="0" y="0" width="170" height="210" rx="26" fill="#0ea5e9" opacity="0.95"/>
      <path d="M48 67H122M48 105H122M48 143H102" stroke="#e0f2fe" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(170 1828)">
    <text x="0" y="0" fill="#dbeafe" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="44" font-weight="700">从重复解释项目，到读取项目状态</text>
    <text x="0" y="76" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="34">A compact guide to file-based AI project memory</text>
  </g>

  <g transform="translate(170 2150)">
    <rect x="0" y="0" width="1260" height="2" fill="#93c5fd" opacity="0.22"/>
    <text x="0" y="92" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="600">Context Engineering Kit Book Series</text>
  </g>
</svg>
